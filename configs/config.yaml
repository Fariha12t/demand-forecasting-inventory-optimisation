project:
  seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  outputs_dir: outputs
  models_dir: models

data:
  source: synthetic          # synthetic | m5
  synthetic:
    n_items: 20
    n_stores: 3
    start_date: "2023-01-01"
    n_days: 1095
    anomaly_rate: 0.004
  m5:                        # used when source: m5 (files in data/raw/)
    n_series: 60             # top-N series by recent sales volume
    history_days: 1095
    stores: null             # e.g. ["CA_1", "TX_1"] or null for all

split:                       # strictly chronological: train | validation | test
  val_days: 28
  test_days: 28

features:
  lags: [7, 14, 28]
  windows: [7, 14, 28]
  price_ref_days: 56

models:
  moving_average: {enabled: true, window: 28}
  seasonal_average: {enabled: true, weeks: 4}
  holt_winters: {enabled: true, train_days: 730}
  arima: {enabled: false, train_days: 365, order: [1, 0, 1], seasonal_order: [0, 1, 1, 7]}
  random_forest:
    enabled: true
    params: {n_estimators: 150, max_depth: 14, min_samples_leaf: 5, max_features: 0.6, max_samples: 0.5, n_jobs: -1, random_state: 42}
  lightgbm:
    enabled: true
    params: {objective: tweedie, tweedie_variance_power: 1.2, learning_rate: 0.05, num_leaves: 63, min_child_samples: 20, subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8, n_estimators: 1500, verbose: -1, random_state: 42}
    early_stopping_rounds: 50
  xgboost:
    enabled: true
    params: {objective: "reg:tweedie", tweedie_variance_power: 1.2, learning_rate: 0.05, max_depth: 7, subsample: 0.8, colsample_bytree: 0.8, n_estimators: 1500, random_state: 42, n_jobs: -1}
    early_stopping_rounds: 50
  lstm:                      # needs `pip install -r requirements-lstm.txt`
    enabled: false
    window: 56
    hidden: 48
    epochs: 6
    batch_size: 512
    lr: 0.003
    stride: 2

inventory:
  service_level: 0.95        # target cycle service level (z = 1.645)
  review_period_days: 7
  default_lead_time_days: 7
  holding_cost_rate: 0.25    # annual, fraction of unit cost
  order_cost: 25.0           # fixed cost per purchase order
  unit_cost_ratio: 0.6       # unit cost = ratio * selling price
  risk_thresholds: {medium: 0.10, high: 0.30}

anomaly:
  window_weeks: 8
  threshold: 4.0
  overdispersion: 0.3        # noise-scale floor: sqrt(mu + overdispersion * mu^2)

monitoring:
  psi_threshold: 0.2
  wape_degradation: 0.25     # retrain if rolling WAPE is 25% worse than validation
  max_model_age_days: 28

mlflow:
  enabled: true
  tracking_uri: "sqlite:///mlflow.db"   # override with MLFLOW_TRACKING_URI
  experiment: demand-forecasting
  registered_model: demand-forecaster

database:
  enabled: false             # or set DATABASE_URL env var (postgresql+psycopg2://...)
