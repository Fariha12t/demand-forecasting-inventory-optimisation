# Scheduled monitoring + conditional retraining. Needs data/ and models/ persisted (e.g. a self-hosted runner,
# cloud storage or the Docker `retrain` service); shown as a template.
name: Weekly monitoring & retrain
on:
  schedule: [{cron: "0 3 * * 1"}]
  workflow_dispatch:
jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: pip install -r requirements.txt && pip install -e .
      - run: python -m demand_forecasting.pipeline prepare-data && python -m demand_forecasting.pipeline train --no-mlflow && python -m demand_forecasting.pipeline retrain
